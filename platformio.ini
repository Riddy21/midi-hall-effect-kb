; PlatformIO Project Configuration File
;
; Single env **uno**: normal Upload only flashes **main.cpp** + mux. Each **`pio test`**
; suite still gets its own firmware (PIO invokes `pio run -e uno` per suite).
;
; Shared test-only sources use `#if defined(PIO_UNIT_TESTING)` so they compile out
; of the application image.

[platformio]
default_envs = uno

[env:uno]
platform = atmelavr
board = uno
framework = arduino
monitor_speed = 115200
test_speed = 115200
lib_extra_dirs = vendor
build_src_filter =
	+<main.cpp>
	+<button.cpp>
	+<eeprom.cpp>
	+<key_calibration.cpp>
	+<mux.cpp>
	+<../test/shared/unity_output.cpp>
test_framework = unity
test_build_src = yes
build_flags = -DSCAN_TEST_KEY_COUNT=10 -DUNITY_INCLUDE_CONFIG_H
