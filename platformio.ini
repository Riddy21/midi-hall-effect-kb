; PlatformIO Project Configuration File
;
; Single env **uno**: normal Upload only flashes **main.cpp** + mux. Each **`pio test`**
; suite still gets its own firmware (PIO invokes `pio run -e uno` per suite).
;
; Shared test-only sources use `#if defined(PIO_UNIT_TESTING)` so they compile out
; of the application image.

[platformio]
default_envs = uno

;
; MIDI quick reference — same codebase, pick env for your board:
;   midi_serial / uno_midi_serial  → ATmega328P Uno-class: MIDI on Serial (host bridge: tools/serial_midi_bridge.py)
;   midi_usb / leonardo           → Leonardo (32U4): native USB MIDI (MIDIUSB)
;   midi_usb_micro / micro        → Arduino Micro (32U4): same USB MIDI stack as leonardo
;   pico                            → RP2040 Pico: scan + EEPROM + serial table (see maxgerhardt git platform)
;   pico_midi_serial                → Pico + serial MIDI (same host bridge as midi_serial)
;

[env:uno]
platform = atmelavr
board = uno
framework = arduino
monitor_speed = 115200
test_speed = 115200
lib_extra_dirs = vendor
build_src_filter =
	+<main.cpp>
	+<button.cpp>
	+<eeprom.cpp>
	+<key_calibration.cpp>
	+<mux.cpp>
	+<midi_api.cpp>
	+<midi_key_scan.cpp>
	+<../test/shared/unity_output.cpp>
test_framework = unity
test_build_src = yes
build_flags = -DSCAN_TEST_KEY_COUNT=10 -DUNITY_INCLUDE_CONFIG_H

; Arduino Uno: raw MIDI bytes on USB-serial CDC (Hairless-class bridge on the host converts to a virtual MIDI port).
; Silence tabular debug so only MIDI runs on Serial. Baud matches monitor_speed unless you override MIDI_SERIAL_BAUD.
[env:uno_midi_serial]
extends = env:uno
build_flags =
	${env:uno.build_flags}
	-DMIDIOUT_ENABLED=1
	-DMIDI_TRANSPORT_SERIAL=1
	-DMIDI_SILENCE_POLL_TABLE=1

; Native USB MIDI: official Arduino MIDIUSB library — same stack as tutorial "Create a MIDI Device"
; https://docs.arduino.cc/tutorials/generic/midi-device/  |  Reference: https://www.arduino.cc/reference/en/libraries/midiusb/
; Repo: https://github.com/arduino-libraries/MIDIUSB
; Needs native USB MCU (Leonardo / Micro / other ATmega32U4-class). Arduino Uno (328P UART bridge) won't enumerate as MIDI via MIDIUSB.
[env:leonardo]
extends = env:uno
board = leonardo
lib_deps =
	arduino-libraries/MIDIUSB @ ^1.0.5
build_flags =
	${env:uno.build_flags}
	-DMIDIOUT_ENABLED=1
	-DMIDI_TRANSPORT_USB=1

[env:micro]
extends = env:leonardo
board = micro

[env:midi_serial]
extends = env:uno_midi_serial

[env:midi_usb]
extends = env:leonardo

[env:midi_usb_micro]
extends = env:micro

;
; Raspberry Pi Pico (RP2040) — **Earle Philhower** Arduino core (EEPROM-compat, toolchain match).
;
; Build:    pio run -e pico
; Upload:  BOOTSEL + UF2 drag, or  pio run -e pico -t upload
;
; Pins: `config.h` uses GPIO indexes (mux 2..7 matches typical wiring). Tweaks → `config_rp2040.h`.
; MIDIUSB (AVR Leonardo) does not apply; use **pico_midi_serial** + host bridge, or add TinyUSB MIDI later.
; Platform package is fetched from Git on first project build (needs network once).
;

[env:pico]
extends = env:uno
platform = https://github.com/maxgerhardt/platform-raspberrypi.git
board = pico
board_build.core = earlephilhower
framework = arduino
build_unflags = -DUNITY_INCLUDE_CONFIG_H

[env:pico_midi_serial]
extends = env:pico
build_flags =
	-DSCAN_TEST_KEY_COUNT=10
	-DMIDIOUT_ENABLED=1
	-DMIDI_TRANSPORT_SERIAL=1
	-DMIDI_SILENCE_POLL_TABLE=1
